<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery • For My Love</title>
    <meta name="description" content="Our beautiful memories." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script defer src="assets/js/main.js"></script>
    <script defer src="assets/js/gallery.js"></script>
  </head>
  <body>
    <div class="bg-glow"></div>
    <div class="hearts" aria-hidden="true"></div>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html" aria-label="For My Love home">
          <span class="brand-heart" aria-hidden="true">♥</span>
          <span class="brand-text">For My Love</span>
        </a>
        <nav class="nav" aria-label="Primary">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link is-active" href="gallery.html">Gallery</a>
          <a class="nav-link" href="reasons.html">Reasons</a>
          <a class="nav-link" href="letters.html">Letters</a>
          <a class="nav-link" href="surprise.html">Surprise</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="section section-tight">
        <div class="container">
          <div class="section-head center">
            <h1 class="section-title">
              ♥ <span class="accent-script">Our Beautiful Memories</span> ♥
            </h1>
            <p class="section-subtitle">Every moment with you is my favorite.</p>
          </div>

          <div class="gallery" id="gallery">
            <button class="photo" type="button">
              <picture>
                <source srcset="assets/img/memory-1.jpg" type="image/jpeg" />
                <img src="assets/img/memory-1.svg" alt="Birthday memory photo 1" loading="lazy" />
              </picture>
              <span class="photo-caption">Kaisley @ 7 • Family</span>
            </button>
            <button class="photo" type="button">
              <picture>
                <source srcset="assets/img/memory-2.jpg" type="image/jpeg" />
                <img src="assets/img/memory-2.svg" alt="Birthday memory photo 2" loading="lazy" />
              </picture>
              <span class="photo-caption">Kaisley @ 7 • Setup</span>
            </button>
            <button class="photo" type="button">
              <picture>
                <source srcset="assets/img/memory-3.jpg" type="image/jpeg" />
                <img src="assets/img/memory-3.svg" alt="Beach day memory photo" loading="lazy" />
              </picture>
              <span class="photo-caption">Beach Day</span>
            </button>
            <button class="photo" type="button">
              <picture>
                <source srcset="assets/img/memory-4.jpg" type="image/jpeg" />
                <img src="assets/img/memory-4.svg" alt="Birthday memory photo 4" loading="lazy" />
              </picture>
              <span class="photo-caption">Kaisley @ 7 • Group</span>
            </button>
            <button class="photo" type="button">
              <picture>
                <source srcset="assets/img/memory-5.jpg" type="image/jpeg" />
                <img src="assets/img/memory-5.svg" alt="Birthday memory photo 5" loading="lazy" />
              </picture>
              <span class="photo-caption">Kaisley @ 7 • Group</span>
            </button>
            <button class="photo" type="button">
              <picture>
                <source srcset="assets/img/memory-6.jpg" type="image/jpeg" />
                <img src="assets/img/memory-6.svg" alt="Family portrait memory" loading="lazy" />
              </picture>
              <span class="photo-caption">Family Portrait</span>
            </button>
          </div>

          <div class="center">
            <a class="btn btn-primary" href="surprise.html">More Memories ♥</a>
          </div>
        </div>
      </section>
    </main>

    <dialog class="lightbox" id="lightbox">
      <button class="lightbox-close" type="button" data-close aria-label="Close">×</button>
      <img id="lightboxImg" alt="Selected memory" />
    </dialog>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p class="footer-text">Made with love • <span id="year"></span></p>
        <a class="footer-link" href="index.html">Back home</a>
      </div>
    </footer>
  </body>
</html>
