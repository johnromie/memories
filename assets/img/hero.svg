<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Sunset couple silhouette">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2a0b24"/>
      <stop offset="0.45" stop-color="#6b2a4a"/>
      <stop offset="1" stop-color="#120814"/>
    </linearGradient>
    <radialGradient id="sun" cx="68%" cy="38%" r="45%">
      <stop offset="0" stop-color="#ffd6a8" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ff8fb6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff4f87" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#160810"/>
      <stop offset="1" stop-color="#09040a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="820" cy="300" r="280" fill="url(#sun)" filter="url(#soft)"/>

  <path d="M0 520 C 220 490, 380 560, 600 530 C 820 500, 980 560, 1200 535 L 1200 800 L 0 800 Z" fill="url(#water)" opacity="0.95"/>
  <path d="M0 560 C 220 530, 390 590, 610 560 C 830 530, 980 590, 1200 565" fill="none" stroke="#ff7aa6" stroke-opacity="0.18" stroke-width="6"/>
  <path d="M0 595 C 240 570, 380 640, 610 605 C 840 570, 980 630, 1200 612" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="6"/>

  <g transform="translate(720 590)">
