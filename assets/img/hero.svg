  <g transform="translate(640 548)" fill="#070408" opacity="0.98">
    <path d="M94 164 C80 115, 86 66, 108 30 C125 2, 150 -8, 176 -8 C206 -8, 230 6, 246 32 C270 70, 274 120, 258 164 C240 212, 112 212, 94 164 Z"/>
