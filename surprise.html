<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surprise • For My Love</title>
    <meta name="description" content="A small surprise for you." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script defer src="assets/js/main.js"></script>
    <script defer src="assets/js/surprise.js"></script>
  </head>
  <body>
    <div class="bg-glow"></div>
    <div class="hearts" aria-hidden="true"></div>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html" aria-label="For My Love home">
          <span class="brand-heart" aria-hidden="true">♥</span>
          <span class="brand-text">For My Love</span>
        </a>
        <nav class="nav" aria-label="Primary">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="gallery.html">Gallery</a>
          <a class="nav-link" href="reasons.html">Reasons</a>
          <a class="nav-link" href="letters.html">Letters</a>
          <a class="nav-link is-active" href="surprise.html">Surprise</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="section section-tight">
        <div class="container">
          <div class="section-head center">
            <h1 class="section-title">♥ Surprise For You ♥</h1>
            <p class="section-subtitle">Click the button below for a little surprise!</p>
          </div>

          <div class="surprise">
            <div class="gift" aria-hidden="true">
              <img src="assets/img/gift.svg" alt="" />
            </div>
            <button class="btn btn-primary btn-lg" type="button" id="openSurprise">
              Open My Surprise 🎁
            </button>
          </div>
        </div>
      </section>
    </main>

    <dialog class="modal" id="surpriseModal" aria-label="Surprise message">
      <button class="modal-close" type="button" data-close aria-label="Close">×</button>
      <div class="modal-body">
        <div class="modal-heart" aria-hidden="true">♥</div>
        <p class="modal-kicker">I just want to say…</p>
        <h2 class="modal-title">Thank you for being YOU! ♥</h2>
        <p class="modal-text">I’m the luckiest person in the world.</p>
        <button class="btn btn-primary" type="button" data-close>I Love You Forever ♥</button>
      </div>
    </dialog>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p class="footer-text">Made with love • <span id="year"></span></p>
        <a class="footer-link" href="gallery.html">Back to memories</a>
      </div>
    </footer>
  </body>
</html>
